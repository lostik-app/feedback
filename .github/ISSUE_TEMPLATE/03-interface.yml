name: "Интерфейс"
description: "Внешний вид, расположение элементов и удобство на телефоне."
labels:
  - "интерфейс"
body:
  -
    type: "markdown"
    attributes:
      value: "Обращения видны всем. Уберите со скриншотов личные переписки и данные для входа. Об уязвимостях сообщайте через закрытую форму в разделе Security."
  -
    type: "input"
    id: "screen"
    attributes:
      label: "На каком экране?"
      placeholder: "Например, профиль, сообщения или фотографии"
  -
    type: "textarea"
    id: "problem"
    attributes:
      label: "Что неудобно или выглядит неправильно?"
    validations:
      required: true
  -
    type: "input"
    id: "environment"
    attributes:
      label: "Устройство и браузер"
      placeholder: "Если знаете ширину экрана, укажите её"
  -
    type: "textarea"
    id: "example"
    attributes:
      label: "Скриншот и желаемый результат"
      description: "Скройте личные данные. Опишите, что должно быть удобнее или понятнее."
    validations:
      required: true
